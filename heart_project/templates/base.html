{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Heart Disease Predictor{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Font Awesome (Medical Icon) -->
    <script src="https://kit.fontawesome.com/yourkit.js" crossorigin="anonymous"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <style>
        body {
            background: #fff;
            color: #333;
        }
        .navbar {
            background: linear-gradient(90deg, #FFB07C, #FF9AA2);
            box-shadow: 0 2px 12px rgba(255,154,162,0.10);
        }
        .navbar-brand, .nav-link, .navbar-toggler {
            color: #fff !important;
        }
        .navbar-brand i {
            color: #FDC6C6;
        }
        .btn-theme {
            background: linear-gradient(90deg, #FFB07C, #FF9AA2);
            color: #fff;
            border-radius: 2rem;
            box-shadow: 0 2px 12px rgba(255,154,162,0.15);
            border: none;
            transition: background 0.3s;
        }
        .btn-theme:hover {
            background: linear-gradient(90deg, #FF9AA2, #FFB07C);
        }
        .card {
            border-radius: 1.5rem;
            box-shadow: 0 4px 24px rgba(255,154,162,0.10);
        }
        .footer {
            background: #FDC6C6;
            color: #fff;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-heartbeat"></i> Heart Predictor
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/predict/">Predict</a></li>
                <li class="nav-item"><a class="nav-link" href="/dashboard/">Dashboard</a></li>
                <li class="nav-item">
                    <button id="theme-toggle" class="btn btn-outline-light ms-2"><i class="fas fa-moon"></i></button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
    </footer>
        <footer class="footer text-center py-3" style="background: linear-gradient(90deg, #FFB07C, #FF9AA2); color: #fff; font-size: 1.1rem; letter-spacing: 0.5px; box-shadow: 0 -2px 12px rgba(255,154,162,0.10);">
            <span class="d-flex justify-content-center align-items-center gap-2">
                <i class="bi bi-stars fs-5"></i>
                <span>© 2025 Heart Disease Predictor. <span style="font-weight:600; color:#fff; text-shadow:0 1px 8px #FF9AA2;"></span></span>
            </span>
        </footer>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="{% static 'js/theme.js' %}"></script>
{% block scripts %}{% endblock %}

</body>
</html>
